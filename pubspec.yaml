name: sarbaz
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.16.2 <3.0.0"

#!#########################
dependencies:
  
  flutter:
    sdk: flutter
##########################
  flutter_multi_formatter: ^2.5.1
  flutter_staggered_grid_view: ^0.6.1
  flutter_styled_toast: ^2.0.0
  get: ^4.6.1
  iconsax: ^0.0.8
  intl: ^0.17.0
  percent_indicator: ^4.0.0
  persian_datetime_picker: ^2.4.0
  persian_tools: ^1.0.1
  syncfusion_flutter_core: ^20.1.47
  syncfusion_flutter_datagrid: ^20.1.47
  syncfusion_localizations: ^20.1.47
  timeago: ^3.2.2
  dotted_border: ^2.0.0+2
  eva_icons_flutter: ^3.1.0
  path_provider: ^2.0.9
  drift: ^1.5.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.8.0
  shamsi_date: ^1.0.1
  json_annotation: ^4.4.0
  json_serializable: ^6.1.4
  logging: ^1.0.1


#!#########################
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^1.0.0
  drift_dev: ^1.5.2
  build_runner: ^2.1.8

#!#########################
flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Sahel
      fonts:
        - asset: assets/fonts/sahel/sahel.ttf
        - asset: assets/fonts/sahel/sahel_bold.ttf
        - asset: assets/fonts/sahel/sahel_black.ttf
        - asset: assets/fonts/sahel/sahel_light.ttf
        - asset: assets/fonts/sahel/sahel_semi_bold.ttf