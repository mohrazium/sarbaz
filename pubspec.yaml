name: sarbaz
description: A new Flutter project.

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=2.16.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter 
  get: 
  intl: 
  logging: 
  drift: 
  sqlite3_flutter_libs: 
  path_provider: 
  path: 
  get_it: 
  json_serializable: ^6.1.5
  json_annotation: 
  persian_tools: 
  iconsax: 
  percent_indicator: 
  dotted_border: 
  timeago: 
  eva_icons_flutter: 
  shamsi_date: 
  fl_chart: 
  flutter_svg: 
  syncfusion_flutter_datagrid: 
  cupertino_icons: 
  syncfusion_localizations:
  syncfusion_flutter_datepicker: 
  flutter_staggered_grid_view: 
  persian_datetime_picker: 
  flutter_styled_toast:
  flutter_multi_formatter: 
  flutter_launcher_icons_maker: 


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 
  drift_dev: 
  flutter_lints:
  build_web_compilers:

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/military_hat.png
   

  fonts:
    - family: Sahel
      fonts:
        - asset: assets/fonts/sahel/sahel.ttf
        - asset: assets/fonts/sahel/sahel_bold.ttf
        - asset: assets/fonts/sahel/sahel_black.ttf
        - asset: assets/fonts/sahel/sahel_light.ttf
        - asset: assets/fonts/sahel/sahel_semi_bold.ttf

flutter_icons:
  android: true
  ios: true
  macos: true
  windows: true
  web: true
  linux: true
  image_path: "assets/images/military_hat.png"
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
