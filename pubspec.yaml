name: sarbaz
description: A new Flutter project.

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=2.16.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter 
  get: ^4.6.1
  intl: ^0.17.0
  logging: ^1.0.1
  drift: ^1.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.0.0
  path: ^1.8.0
  get_it: ^7.2.0
  json_serializable: ^6.1.4
  json_annotation: ^4.4.0
  persian_tools: ^1.0.1
  iconsax: ^0.0.8
  percent_indicator: ^3.4.0
  dotted_border: ^2.0.0+1
  timeago: ^3.1.0
  eva_icons_flutter: ^3.0.2
  shamsi_date: ^1.0.1
  fl_chart: ^0.41.0
  flutter_svg: ^1.0.3
  syncfusion_flutter_datagrid: ^19.4.48+1
  cupertino_icons: ^1.0.2
  syncfusion_localizations: ^19.4.53
  syncfusion_flutter_datepicker: ^19.4.53
  flutter_staggered_grid_view: ^0.6.1
  persian_datetime_picker: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 
  drift_dev: 
  flutter_lints:

flutter:
  uses-material-design: true

  assets:
    - assets/images/
   

  fonts:
    - family: Sahel
      fonts:
        - asset: assets/fonts/sahel/sahel.ttf
        - asset: assets/fonts/sahel/sahel_bold.ttf
        - asset: assets/fonts/sahel/sahel_black.ttf
        - asset: assets/fonts/sahel/sahel_light.ttf
        - asset: assets/fonts/sahel/sahel_semi_bold.ttf

  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
